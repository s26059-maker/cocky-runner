plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cocky'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	// Tests tagged "docker" need a real Docker daemon (with gcc:14 and
	// python:3.11-slim already pulled) and are excluded from the default run so
	// `./gradlew test`/CI doesn't break on a machine without Docker - run them
	// explicitly via `./gradlew dockerTest`.
	useJUnitPlatform {
		excludeTags 'docker'
	}
}

tasks.register('dockerTest', Test) {
	description = 'Runs tests tagged "docker" - requires a running Docker daemon with gcc:14 and python:3.11-slim already pulled.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'docker'
	}
	shouldRunAfter test
}
