spring:
  application:
    name: cocky-runner

app:
  cors:
    allowed-origins:
      - http://localhost:5173

runner:
  docker:
    timeout-seconds: 5
    memory: 256m
    cpus: 1.0
    pids-limit: 64
    max-output-bytes: 65536
    work-dir: build/judge-work
    images:
      c: gcc:14
      python: python:3.11-slim
