spring:
  application:
    name: cocky-runner

app:
  cors:
    allowed-origins:
      - http://localhost:5173

runner:
  docker:
    timeout-seconds: 5
    memory: 256m
    cpus: 1.0
    pids-limit: 64
    max-output-bytes: 65536
    work-dir: build/judge-work
    # startup-budget-ms: 컨테이너 기동 오버헤드 예산 (언어별).
    # 산정 규칙: max(순차 max × 2, 동시 max) → 500 단위 올림.
    # 지표: totalWallMs - userWallMs (DockerRunner 경유, 실행 단계만).
    # 2026-10 재측정 (순차 60회 / 동시 4개 × 5라운드):
    #   C      순차 353~575, 동시 876~1270 (judge0 정지 상태) → max(1150, 1270) → 1500
    #   Python 순차 364~590, 동시 1051~1263 (judge0 가동 중)  → max(1180, 1263) → 1500
    # 측정 시 judge0 등 다른 컨테이너 정지 필수 (켜 둔 채 재면 C 순차 max가 1108까지 튄다).
    # 부족하면 오판정 TLE, 남으면 처리량 손해 — 비용이 비대칭이라 후자를 택한다.
    languages:
      c:
        image: gcc:14
        startup-budget-ms: 1500
      python:
        image: python:3.11-slim
        startup-budget-ms: 1500
      java:
        image: eclipse-temurin:21-jdk
        # DockerRunner 경유 실측 (2026-09, 유휴 상태): 기동 오버헤드(total - user)
        # 순차 60회 461~680ms, 동시 4개 20회 최대 1325ms.
        # C와 차이는 노이즈 수준 — JVM 기동은 userWallMs에 포함되어 시간 제한이 커버함.
        startup-budget-ms: 1500
server:
  port: 18080